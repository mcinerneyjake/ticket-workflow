# CI gate for the ticket-workflow package: typecheck + tests on every PR/push to main.
# `npm ci` runs the `prepare` build, so a green gate also proves dist/ compiles.
# Actions are SHA-pinned (a mutable tag can be repointed at malicious code); refresh via Dependabot.

name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a run on main.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
