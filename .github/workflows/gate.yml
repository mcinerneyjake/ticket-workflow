# CI gate for the ticket-workflow package: typecheck + tests on every PR/push to main.
# `npm ci` runs the `prepare` build, so a green gate also proves dist/ compiles.
# Actions are SHA-pinned (a mutable tag can be repointed at malicious code); refresh via Dependabot.

name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a run on main.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 24 is the `engines.node` floor: declaring a floor CI never runs is how the
  # @types/node drift went unnoticed (tkt-dd957c29c349). Bump both together.
  # Single leg because 24 is the newest LTS — add the next one when it ships
  # (Node 26 enters LTS 2026-10), so the matrix keeps covering floor + newest.
  suite:
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Coverage variant so the per-file thresholds in vitest.config.ts are enforced, not just run.
      - run: npm run test:coverage
      # Last of the blocking checks on purpose: its verdict comes from a live advisory feed, so it is
      # the one step that can go red on a diff that changed nothing — and a job aborts at its first
      # failure, so running it earlier would suppress every diff-derived signal behind it.
      # Scoped to high/critical for the same reason: moderate advisories against unreachable
      # transitive packages would make this the check that always fires, which is the check people
      # stop reading (tkt-3a91af2aa6d9). Widening the threshold is never the fix — CLAUDE.md →
      # Quality gate names the escape hatch. Pinned by ci.gate.test.mjs.
      - run: npm audit --audit-level=high
      # Dogfood: the package that defines the guardrail standard must pass it. `npm ci` already
      # built dist via prepare. GH_TOKEN lets the branch-protection check ask the API — without it
      # that check reports BLOCKED and the audit exits 1.
      - run: node dist/cli/index.js audit .
        env:
          GH_TOKEN: ${{ github.token }}

  # `gate` is the required status check on main, so it must keep that exact name
  # and must FAIL — not skip — when a suite leg fails; a skipped required check
  # can be read as satisfied.
  gate:
    needs: [suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "suite: ${{ needs.suite.result }}"
          [ "${{ needs.suite.result }}" = "success" ] || exit 1
