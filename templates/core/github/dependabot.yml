version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # `applies-to` defaults to version-updates, so groups do NOT cover security updates unless
      # asked. Without this block, ungrouped security PRs accumulate and each lock-file merge forces
      # the rest to rebase — do not drop it.
      security:
        applies-to: security-updates
        patterns: ['*']
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # @types/node must track the Node runtime in `engines`, never run ahead of it — types for a
      # newer Node let typecheck pass code the runtime cannot execute. Lift when `engines` moves,
      # bumping the runtime and its types in the same change.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore
